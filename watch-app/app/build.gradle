plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'   // generates the AppFunctions (Gemini) service
}

// Release signing comes from CI secrets; without them it falls back to the debug key.
def ks = System.getenv("KEYSTORE_FILE")

android {
    namespace 'io.github.peterchabs.sayso'
    compileSdk 37   // AppFunctions needs 37 to build; the apps still run on Android 8+ / Wear OS 3+

    defaultConfig {
        applicationId 'io.github.peterchabs.sayso'
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName System.getenv("VERSION_NAME") ?: "1.0"
    }

    // One codebase, two apps: SaySo-watch.apk and SaySo-phone.apk
    flavorDimensions = ["device"]
    productFlavors {
        watch {
            dimension "device"
            minSdk 30      // Wear OS 3 (Galaxy Watch 4) and newer
        }
        phone {
            dimension "device"
            minSdk 26      // Android 8 and newer
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storeType 'pkcs12'
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
        unitTests.all { environment 'SCREENSHOTS_DIR', System.getenv('SCREENSHOTS_DIR') ?: '' }
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'   // draws the sign-in QR code
    // watch: stop the phone's copies of notifications while the watch shows its own (no doubles)
    watchImplementation 'androidx.wear:wear-phone-interactions:1.1.1'
    // watch: the live-connection notice as an Ongoing Activity (watch-face icon, Recents), as Wear OS asks
    watchImplementation 'androidx.wear:wear-ongoing:1.0.0'
    phoneImplementation 'androidx.core:core-google-shortcuts:1.1.0'   // offers the shortcut to Google Assistant
    implementation 'androidx.appfunctions:appfunctions:1.0.0'    // lets Gemini send through Say So (Android 16+ / Wear OS 6+)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    ksp 'androidx.appfunctions:appfunctions-compiler:1.0.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.18.1'   // renders README screenshots
}

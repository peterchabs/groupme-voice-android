name: Watch app

on:
  push:
    branches: [main]
    paths: ["watch-app/**", ".github/workflows/watch-app.yml"]
    tags: ["watch-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/watch-v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF#refs/tags/watch-v}" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          fi

      - name: Test and build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle -p watch-app --no-daemon test assembleRelease

      - name: Name the APK
        run: cp watch-app/app/build/outputs/apk/release/app-release.apk GroupMeVoice-watch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GroupMeVoice-watch
          path: GroupMeVoice-watch.apk

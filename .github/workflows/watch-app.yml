name: Apps

on:
  push:
    branches: [main]
    paths: ["watch-app/**", ".github/workflows/watch-app.yml"]
    tags: ["watch-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Android SDK 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/watch-v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF#refs/tags/watch-v}" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          fi

      - name: Test and build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle -p watch-app --no-daemon test assembleWatchRelease assemblePhoneRelease

      - name: Name the APKs
        run: |
          cp watch-app/app/build/outputs/apk/watch/release/app-watch-release.apk SaySo-watch.apk
          cp watch-app/app/build/outputs/apk/phone/release/app-phone-release.apk SaySo-phone.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SaySo
          path: |
            SaySo-watch.apk
            SaySo-phone.apk
